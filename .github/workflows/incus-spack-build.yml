name: Incus Spack Build

on:
  workflow_dispatch:
    inputs:
      os:
        description: Target Rocky Linux version
        required: true
        type: choice
        default: rocky9
        options:
          - rocky9
          - rocky8
          - all
      flavor:
        description: Environment flavor
        required: true
        type: choice
        default: canary
        options:
          - canary
          - prod
      section:
        description: Section or integration target
        required: true
        type: choice
        default: all
        options:
          - all
          - full
          - toolchain
          - devtools
          - python
          - mpi
          - libs
          - gpu
          - benchmarks
          - profiling
      git_ref:
        description: Optional branch, tag, or SHA to build; defaults to workflow ref
        required: false
        type: string
        default: ""
      push_buildcache:
        description: Publish successful build outputs to the NAS buildcache
        required: true
        type: boolean
        default: true
      spack_install_args:
        description: Arguments passed to spack install inside the container
        required: true
        type: string
        default: -p 1 --fail-fast
      runner_label:
        description: Common custom label on the Rocky Incus container runners
        required: true
        type: string
        default: chapar
      resources_root:
        description: CI output root inside containers
        required: true
        type: string
        default: /resources/chapar

permissions:
  contents: read

concurrency:
  group: chapar-incus-builders
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.flavor }} ${{ inputs.section }} on ${{ matrix.os_name }}
    if: ${{ inputs.os == 'all' || inputs.os == matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: rocky8
          - os_name: rocky9
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","{1}"]', inputs.runner_label, matrix.os_name)) }}
    timeout-minutes: 1440

    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v4

      - name: Bootstrap Rocky dependencies
        run: bash ci/bootstrap-rocky.sh

      - name: Run Spack build
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref }}
          DEFAULT_GIT_REF: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_DIR: ${{ github.workspace }}
          FLAVOR: ${{ inputs.flavor }}
          SECTION: ${{ inputs.section }}
          OS_NAME: ${{ matrix.os_name }}
          PUSH_BUILDCACHE: ${{ inputs.push_buildcache }}
          SPACK_INSTALL_ARGS: ${{ inputs.spack_install_args }}
          RESOURCES_ROOT: ${{ inputs.resources_root }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export GIT_REF="${INPUT_GIT_REF:-${DEFAULT_GIT_REF}}"
          bash ci/container-build.sh
