name: Incus Chapar Environment Build

on:
  workflow_call:
    inputs:
      os:
        description: Target Rocky Linux version
        required: true
        type: string
        default: rocky10
      env_name:
        description: Chapar environment name
        required: true
        type: string
        default: hpcsim
      env_path:
        description: Spack environment path; empty means envs/<env_name>
        required: false
        type: string
        default: ""
      build_action:
        description: Whether to only concretize or concretize and build
        required: true
        type: string
        default: build
      build_mode:
        description: Build mode; auto uses release.sh when the environment has one
        required: true
        type: string
        default: auto
      release_id:
        description: Optional release/run ID; defaults to the workflow run ID
        required: false
        type: string
        default: ""
      git_ref:
        description: Optional branch, tag, or SHA to build; defaults to workflow ref
        required: false
        type: string
        default: ""
      spack_ref:
        description: Spack branch, tag, or SHA to use for builds
        required: true
        type: string
        default: develop
      publish_current:
        description: Promote this release by updating the OS current symlink
        required: true
        type: boolean
        default: false
      publish_modules:
        description: Publish the shared module-root symlink without promoting current
        required: true
        type: boolean
        default: false
      publish_buildcache:
        description: Publish successful build outputs to the shared Chapar buildcache
        required: true
        type: boolean
        default: true
      spack_install_args:
        description: Arguments passed to spack install inside the container
        required: true
        type: string
        default: -j 8 -p 4
      runner_label:
        description: Common custom label on the Rocky Incus container runners
        required: true
        type: string
        default: chapar
      env_root:
        description: Shared environment output root inside containers; empty means /resources/chapar/<env_name>
        required: false
        type: string
        default: ""
      hpcsim_root:
        description: Legacy hpcsim output root alias used when env_root is empty
        required: false
        type: string
        default: /resources/chapar/hpcsim
      buildcache_root:
        description: Shared Chapar binary cache root inside containers
        required: true
        type: string
        default: /resources/chapar/cache/buildcache
      ccache_root:
        description: Shared compiler ccache root inside containers
        required: true
        type: string
        default: /resources/chapar/cache/ccache

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.env_name }} on ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        os_name: ${{ fromJSON((inputs.os || 'all') == 'all' && '["rocky10"]' || format('["{0}"]', inputs.os || 'rocky10')) }}
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","{1}"]', inputs.runner_label || 'chapar', matrix.os_name)) }}
    timeout-minutes: 1440

    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v4

      - name: Bootstrap Rocky dependencies
        run: bash ci/bootstrap-rocky.sh

      - name: Verify environment resources mount
        env:
          ENV_NAME: ${{ inputs.env_name }}
          ENV_PATH: ${{ inputs.env_path || format('envs/{0}', inputs.env_name) }}
          CHAPAR_ENV_ROOT: ${{ inputs.env_root || (inputs.env_name == 'hpcsim' && inputs.hpcsim_root) || format('/resources/chapar/{0}', inputs.env_name) }}
          CHAPAR_BUILDCACHE_ROOT: ${{ inputs.buildcache_root || format('/resources/chapar/cache/buildcache/{0}', inputs.env_name) }}
          CHAPAR_CCACHE_ROOT: ${{ inputs.ccache_root || '/resources/chapar/cache/ccache' }}
          OS_NAME: ${{ matrix.os_name }}
          RUN_ID: ${{ github.run_id }}
          PUBLISH_CURRENT: ${{ (inputs.env_name == 'vlad' && 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_current == true && 'true') || 'false' }}
          PUBLISH_MODULES: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_modules == true && 'true' || 'false' }}
          PUBLISH_BUILDCACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_buildcache == false && 'false' || 'true' }}
        run: |
          set -euo pipefail

          if [ "${ENV_NAME}" = hpcsim ]; then
            cat > envs/hpcsim/hpcsim-site.env <<EOF
          CHAPAR_INSTALL_MODE=public
          HPCSIM_PUBLIC_ROOT=${CHAPAR_ENV_ROOT}
          CHAPAR_ENV_ROOT=${CHAPAR_ENV_ROOT}
          CHAPAR_BUILDCACHE_ROOT=${CHAPAR_BUILDCACHE_ROOT}
          CHAPAR_CCACHE_ROOT=${CHAPAR_CCACHE_ROOT}
          PUBLISH_BUILDCACHE=${{ github.event_name == 'workflow_dispatch' && inputs.publish_buildcache == false && 'false' || 'true' }}
          PUBLISH_CURRENT=${{ github.event_name == 'workflow_dispatch' && inputs.publish_current == true && 'true' || 'false' }}
          PUBLISH_MODULES=${{ github.event_name == 'workflow_dispatch' && inputs.publish_modules == true && 'true' || 'false' }}
          EOF
            CHAPAR_ENV_ROOT="${CHAPAR_ENV_ROOT}" bash ci/prepare-hpcsim-root.sh
          elif [ "${ENV_NAME}" = "vlad" ]; then
            cat > envs/vlad/vlad-site.env <<EOF
          CHAPAR_INSTALL_MODE=public
          VLAD_PUBLIC_ROOT=${CHAPAR_ENV_ROOT}
          CHAPAR_ENV_ROOT=${CHAPAR_ENV_ROOT}
          CHAPAR_BUILDCACHE_ROOT=${CHAPAR_BUILDCACHE_ROOT}
          CHAPAR_CCACHE_ROOT=${CHAPAR_CCACHE_ROOT}
          CHAPAR_MODULE_ROOT=/resources/chapar/vlad/modulefiles
          PUBLISH_BUILDCACHE=true
          PUBLISH_CURRENT=${PUBLISH_CURRENT}
          PUBLISH_MODULES=true
          EOF
          else
            mkdir -p "${CHAPAR_ENV_ROOT}/${OS_NAME}/runs" "${CHAPAR_BUILDCACHE_ROOT}/${OS_NAME}" "${CHAPAR_CCACHE_ROOT}/${OS_NAME}"
          fi

          fs_type="$(findmnt -n -T "${CHAPAR_ENV_ROOT}" -o FSTYPE)"
          source="$(findmnt -n -T "${CHAPAR_ENV_ROOT}" -o SOURCE)"
          cache_fs_type="$(findmnt -n -T "${CHAPAR_BUILDCACHE_ROOT}" -o FSTYPE)"
          cache_source="$(findmnt -n -T "${CHAPAR_BUILDCACHE_ROOT}" -o SOURCE)"
          ccache_fs_type="$(findmnt -n -T "${CHAPAR_CCACHE_ROOT}" -o FSTYPE)"
          ccache_source="$(findmnt -n -T "${CHAPAR_CCACHE_ROOT}" -o SOURCE)"
          echo "env name: ${ENV_NAME}"
          echo "env path: ${ENV_PATH}"
          echo "env root: ${CHAPAR_ENV_ROOT}"
          echo "mount source: ${source}"
          echo "mount type:   ${fs_type}"
          echo "buildcache root: ${CHAPAR_BUILDCACHE_ROOT}"
          echo "cache source:     ${cache_source}"
          echo "cache type:       ${cache_fs_type}"
          echo "ccache root:      ${CHAPAR_CCACHE_ROOT}"
          echo "ccache source:    ${ccache_source}"
          echo "ccache type:      ${ccache_fs_type}"

          case "${fs_type}" in
            nfs|nfs4) ;;
            *) echo "ERROR: ${CHAPAR_ENV_ROOT} must be on the resources NFS mount, got ${fs_type}" >&2; exit 1 ;;
          esac
          case "${cache_fs_type}" in
            nfs|nfs4) ;;
            *) echo "ERROR: ${CHAPAR_BUILDCACHE_ROOT} must be on the resources NFS mount, got ${cache_fs_type}" >&2; exit 1 ;;
          esac
          case "${ccache_fs_type}" in
            nfs|nfs4) ;;
            *) echo "ERROR: ${CHAPAR_CCACHE_ROOT} must be on the resources NFS mount, got ${ccache_fs_type}" >&2; exit 1 ;;
          esac

          test_dir="${CHAPAR_ENV_ROOT}/${OS_NAME}/.ci-write-test-${RUN_ID}"
          mkdir -p "${test_dir}"
          rmdir "${test_dir}"
          cache_test_dir="${CHAPAR_BUILDCACHE_ROOT}/${OS_NAME}/.ci-write-test-${RUN_ID}"
          mkdir -p "${cache_test_dir}"
          rmdir "${cache_test_dir}"
          ccache_test_dir="${CHAPAR_CCACHE_ROOT}/${OS_NAME}/.ci-write-test-${RUN_ID}"
          mkdir -p "${ccache_test_dir}"
          rmdir "${ccache_test_dir}"

      - name: Run environment build
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref || '' }}
          DEFAULT_GIT_REF: ${{ github.sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id || '' }}
          DEFAULT_RELEASE_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_DIR: ${{ github.workspace }}
          OS_NAME: ${{ matrix.os_name }}
          ENV_NAME: ${{ inputs.env_name }}
          ENV_PATH: ${{ inputs.env_path || format('envs/{0}', inputs.env_name) }}
          CHAPAR_ENV_ROOT: ${{ inputs.env_root || (inputs.env_name == 'hpcsim' && inputs.hpcsim_root) || format('/resources/chapar/{0}', inputs.env_name) }}
          CHAPAR_ENV_ACTION: ${{ inputs.build_action || 'build' }}
          CHAPAR_ENV_BUILD_MODE: ${{ inputs.build_mode || 'auto' }}
          HPCSIM_ROOT: ${{ (inputs.env_name == 'hpcsim' && (inputs.env_root || inputs.hpcsim_root)) || '' }}
          CHAPAR_BUILDCACHE_ROOT: ${{ inputs.buildcache_root || format('/resources/chapar/cache/buildcache/{0}', inputs.env_name) }}
          CHAPAR_CCACHE_ROOT: ${{ inputs.ccache_root || '/resources/chapar/cache/ccache' }}
          CHAPAR_MODULE_ROOT: ${{ inputs.env_name == 'vlad' && '/resources/chapar/vlad/modulefiles' || '' }}
          PUBLISH_CURRENT: ${{ (inputs.env_name == 'vlad' && 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_current == true && 'true') || 'false' }}
          PUBLISH_MODULES: ${{ (inputs.env_name == 'vlad' && 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_modules == true && 'true' || 'false') }}
          PUBLISH_BUILDCACHE: ${{ (inputs.env_name == 'vlad' && 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_buildcache == false && 'false' || 'true') }}
          SPACK_INSTALL_ARGS: ${{ inputs.spack_install_args || '-j 8 -p 4' }}
          CHAPAR_CONCRETIZE_TIMEOUT: 3600
          RUN_ID: ${{ github.run_id }}
          SPACK_REF: ${{ inputs.spack_ref || 'develop' }}
          CHAPAR_UPDATE_SPACK: true
        run: |
          source ./etc/init.sh
          export SPACK_USER_CACHE_PATH="/var/tmp/chapar-spack-cache/${OS_NAME}"
          mkdir -p "${SPACK_USER_CACHE_PATH}"
          export GIT_REF="${INPUT_GIT_REF:-${DEFAULT_GIT_REF}}"
          export RELEASE_ID="${INPUT_RELEASE_ID:-${DEFAULT_RELEASE_ID}}"
          bash ci/container-build.sh

      - name: Run integrity validation
        if: success()
        env:
          ENV_NAME: ${{ inputs.env_name }}
          OS_NAME: ${{ matrix.os_name }}
        run: |
          set -euo pipefail
          source ./etc/init.sh
          # Run as login shell to pick up /etc/profile.d/modules.sh which
          # defines the module(1) function not inherited by subprocesses.
          bash -l validation/tests/integrity-test.sbatch
