name: Incus hpcsim Build

on:
  push:
    branches:
      - main
    paths:
      - .github/incus-spack-build.trigger
      - .github/workflows/incus-spack-build.yml
      - ci/**
      - envs/hpcsim/**
      - etc/**
      - Makefile
  workflow_dispatch:
    inputs:
      os:
        description: Target Rocky Linux version
        required: true
        type: choice
        default: all
        options:
          - all
          - rocky8
          - rocky9
      release_id:
        description: Optional hpcsim release ID; defaults to the workflow run ID
        required: false
        type: string
        default: ""
      git_ref:
        description: Optional branch, tag, or SHA to build; defaults to workflow ref
        required: false
        type: string
        default: ""
      spack_ref:
        description: Spack branch, tag, or SHA to use for builds
        required: true
        type: string
        default: develop
      publish_current:
        description: Promote this release by updating the OS current symlink
        required: true
        type: boolean
        default: false
      publish_buildcache:
        description: Publish successful build outputs to the hpcsim buildcache
        required: true
        type: boolean
        default: true
      spack_install_args:
        description: Arguments passed to spack install inside the container
        required: true
        type: string
        default: -p 1
      runner_label:
        description: Common custom label on the Rocky Incus container runners
        required: true
        type: string
        default: chapar
      hpcsim_root:
        description: Shared hpcsim output root inside containers
        required: true
        type: string
        default: /resources/share/hpcsim

permissions:
  contents: read

jobs:
  build:
    name: Build hpcsim on ${{ matrix.os_name }}
    strategy:
      fail-fast: false
      matrix:
        os_name: ${{ fromJSON((inputs.os || 'all') == 'all' && '["rocky8","rocky9"]' || format('["{0}"]', inputs.os || 'rocky9')) }}
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","{1}"]', inputs.runner_label || 'chapar', matrix.os_name)) }}
    timeout-minutes: 1440
    concurrency:
      group: chapar-incus-builders-${{ matrix.os_name }}
      cancel-in-progress: false

    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v4

      - name: Bootstrap Rocky dependencies
        run: bash ci/bootstrap-rocky.sh

      - name: Verify hpcsim resources mount
        env:
          HPCSIM_ROOT: ${{ inputs.hpcsim_root || '/resources/share/hpcsim' }}
          OS_NAME: ${{ matrix.os_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          bash ci/prepare-hpcsim-root.sh
          fs_type="$(findmnt -n -T "${HPCSIM_ROOT}" -o FSTYPE)"
          source="$(findmnt -n -T "${HPCSIM_ROOT}" -o SOURCE)"
          echo "hpcsim root: ${HPCSIM_ROOT}"
          echo "mount source: ${source}"
          echo "mount type:   ${fs_type}"

          case "${fs_type}" in
            nfs|nfs4) ;;
            *) echo "ERROR: ${HPCSIM_ROOT} must be on the resources NFS mount, got ${fs_type}" >&2; exit 1 ;;
          esac

          test_dir="${HPCSIM_ROOT}/${OS_NAME}/.ci-write-test-${RUN_ID}"
          mkdir -p "${test_dir}"
          rmdir "${test_dir}"

      - name: Run hpcsim build
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref || '' }}
          DEFAULT_GIT_REF: ${{ github.sha }}
          INPUT_RELEASE_ID: ${{ inputs.release_id || '' }}
          DEFAULT_RELEASE_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_DIR: ${{ github.workspace }}
          OS_NAME: ${{ matrix.os_name }}
          HPCSIM_ROOT: ${{ inputs.hpcsim_root || '/resources/share/hpcsim' }}
          PUBLISH_CURRENT: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_current == true && 'true' || 'false' }}
          PUBLISH_BUILDCACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_buildcache == false && 'false' || 'true' }}
          SPACK_INSTALL_ARGS: ${{ inputs.spack_install_args || '-p 1' }}
          RUN_ID: ${{ github.run_id }}
          SPACK_REF: ${{ inputs.spack_ref || 'develop' }}
          CHAPAR_UPDATE_SPACK: true
        run: |
          export GIT_REF="${INPUT_GIT_REF:-${DEFAULT_GIT_REF}}"
          export RELEASE_ID="${INPUT_RELEASE_ID:-${DEFAULT_RELEASE_ID}}"
          bash ci/container-build.sh
