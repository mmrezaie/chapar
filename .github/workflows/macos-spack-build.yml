name: macOS Spack Build

on:
  push:
    branches:
      - main
    paths:
      - .github/macos-spack-build.trigger
      - .github/workflows/macos-spack-build.yml
  workflow_dispatch:
    inputs:
      section:
        description: Section or integration target
        required: true
        type: choice
        default: full
        options:
          - all
          - full
          - toolchain
          - devtools
          - python
          - mpi
          - libs
          - benchmarks
          - profiling
      git_ref:
        description: Optional branch, tag, or SHA to build; defaults to workflow ref
        required: false
        type: string
        default: ""
      spack_ref:
        description: Spack branch, tag, or SHA to use for canary builds
        required: true
        type: string
        default: develop
      push_buildcache:
        description: Publish successful build outputs to a local macOS buildcache
        required: true
        type: boolean
        default: false
      spack_install_args:
        description: Arguments passed to spack install on the macOS runner
        required: true
        type: string
        default: -p 1 --fail-fast
      runner_label:
        description: Common custom label on the macOS self-hosted runner
        required: true
        type: string
        default: chapar
      resources_root:
        description: Run logs/buildcache root; empty uses ~/privatemodules/chapar-runs
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: chapar-macos-builders
  cancel-in-progress: false

jobs:
  build:
    name: Build canary ${{ inputs.section || 'mpi' }} on macOS
    runs-on: ${{ fromJSON(format('["self-hosted","{0}","macos","arm64"]', inputs.runner_label || 'chapar')) }}
    timeout-minutes: 1440

    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@v4

      - name: Bootstrap macOS dependencies
        run: bash ci/bootstrap-macos.sh

      - name: Run Spack canary build
        env:
          INPUT_GIT_REF: ${{ inputs.git_ref || '' }}
          DEFAULT_GIT_REF: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_DIR: ${{ github.workspace }}
          SECTION: ${{ inputs.section || 'mpi' }}
          PUSH_BUILDCACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.push_buildcache == true && 'true' || 'false' }}
          SPACK_INSTALL_ARGS: ${{ inputs.spack_install_args || '-p 1 --fail-fast' }}
          RESOURCES_ROOT_INPUT: ${{ inputs.resources_root || '' }}
          RUN_ID: ${{ github.run_id }}
          SPACK_REF: ${{ inputs.spack_ref || 'develop' }}
          CHAPAR_UPDATE_SPACK: true
        run: |
          set -euo pipefail
          export GIT_REF="${INPUT_GIT_REF:-${DEFAULT_GIT_REF}}"
          export FLAVOR=canary
          export OS_NAME=macos
          export RESOURCES_ROOT="${RESOURCES_ROOT_INPUT:-${HOME}/privatemodules/chapar-runs}"
          export CHAPAR_SPACK_ROOT="${HOME}/.local/opt/spack-chapar-macos"
          mkdir -p "${RESOURCES_ROOT}"
          bash ci/container-build.sh
