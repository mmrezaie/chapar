# This is a Spack Environment file.
#
# skipper-canary keeps the same specs as skipper, but loads filesystem locations
# from locations.yaml so canary installs can move without editing this file.
#
spack:
  repos: []
  include:
  - path: ./locations.yaml
  - path: ../common/specs.yaml
  - path: ./rocky8
    optional: true
    when: os == "rocky8"
  - path: ./rocky9
    optional: true
    when: os == "rocky9"
  - path: ./macos
    optional: true
    when: platform == "darwin"
  config:
    deprecated: true

  # add package specs to the `specs` list
  specs:
  - $common_specs
  - $linux_specs
  - $rocky8_specs
  - $rocky9_specs
  - $macos_specs
  packages:
    all:
      providers:
        mpi: [openmpi, intel-oneapi-mpi]
        blas: [openblas]
        lapack: [openblas]
        scalapack: [netlib-scalapack]
  view: false
  concretizer:
    unify: when_possible
  modules:
    default:
      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'
