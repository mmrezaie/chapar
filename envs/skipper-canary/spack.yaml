# This is a Spack Environment file.
#
# skipper-canary keeps the same specs as skipper, but loads filesystem locations
# from locations.yaml so canary installs can move without editing this file.
#
spack:
  repos: []
  include:
  - path: ./locations.yaml
  - path: ./rocky8
    optional: true
    when: os == "rocky8"
  - path: ./rocky9
    optional: true
    when: os == "rocky9"
  - path: ./macos
    optional: true
    when: platform == "darwin"
  config:
    deprecated: true

  # add package specs to the `specs` list
  definitions:
  - mpis: [openmpi, intel-oneapi-mpi]
  - compilers: [gcc@13.4.0, gcc@14.3.0, gcc@15.2.0, intel-oneapi-compilers]
  specs:
  - gcc@13.4.0+profiled
  - gcc@14.3.0+profiled
  - gcc@15.2.0+profiled
  - intel-oneapi-compilers@2025.3.1
  - ucx@1.16.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs+xpmem cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - libfabric@1.22.0+cuda+gdrcopy fabrics=mlx,verbs cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - openmpi@4.1.8+cuda fabrics=verbs,ucx,ofi schedulers=none cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - openmpi@5.0.8+cuda fabrics=verbs,ucx,ofi schedulers=none cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - libffi@3.2.1
  - cuda@13.0.2
  - neovim
  - npm
  - tmux
  - tcl
  - tk
  - python@3.8:3.8+optimizations+tkinter
  - python@3.10:3.10+optimizations+tkinter
  - python@3.11:3.11+optimizations+tkinter
  - python@3.12:3.12+optimizations+tkinter
  - python@3.13:3.13+optimizations+tkinter
  - python@3.14:3.14+optimizations+tkinter
  - intel-oneapi-mpi@2021.17.0+generic-names
  - intel-oneapi-mpi@2021.14.0+generic-names
  - intel-oneapi-mpi@2021.10.0+generic-names
  - intel-oneapi-compilers@2024.1.0
  - intel-oneapi-compilers@2023.1.0
  - hpctoolkit@2024.01.stable+cuda+mpi+python
  - hpctoolkit@2025.0.1+cuda+mpi+python~auditor_default
  - autoconf
  - pulseaudio@13.0 ^fftw~mpi
  - imagemagick@7.1.1-39
  - numactl
  - cmake
  - ninja
  - meson
  - pkgconf
  - openblas threads=openmp
  - fftw+mpi+openmp precision=double,float
  - netlib-scalapack
  - hdf5+mpi+fortran+hl
  - parallel-netcdf
  - netcdf-c+mpi+parallel-netcdf
  - netcdf-fortran
  - osu-micro-benchmarks+cuda cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - intel-mpi-benchmarks
  - qperf+verbs
  - ior+hdf5+ncmpi
  - mdtest
  - h5bench+all
  - fio
  - hpl+openmp
  - hpcg+openmp
  - stream+openmp
  - babelstream+cuda cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - nccl@2.28.7-1 cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - nccl-tests+mpi+cuda cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f ^nccl@2.28.7-1 cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - nvshmem+cuda+mpi+ucx+libfabric+nccl cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f ^nccl@2.28.7-1 cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - nvbandwidth+cuda cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - cuda-memtest
  - nvtx+python
  - nvtop+cuda support=nvidia cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - papi+infiniband+cuda
  - likwid
  - scorep+mpi+papi+cuda
  - scalasca
  - caliper+mpi+papi+cuda+libunwind+libdw cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  - tau+mpi+papi+openmp~cuda
  - darshan-runtime+mpi+hdf5+parallel-netcdf
  - darshan-util
  - gdb+python
  - valgrind+mpi
  - hwloc+cuda+pci+nvml cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  packages:
    all:
      providers:
        mpi: [openmpi, intel-oneapi-mpi]
        blas: [openblas]
        lapack: [openblas]
        scalapack: [netlib-scalapack]
    openmpi:
      require:
      - +cuda
      - fabrics=verbs,ucx,ofi
      - schedulers=none
      - ^ucx@1.16.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs+xpmem cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
      - ^libfabric@1.22.0+cuda+gdrcopy fabrics=mlx,verbs cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
    intel-oneapi-mpi:
      require:
      - +external-libfabric
      - ^libfabric@1.22.0+cuda+gdrcopy fabrics=mlx,verbs cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
    ucx:
      require:
      - +cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs+xpmem
      - cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
    libfabric:
      require:
      - +cuda+gdrcopy
      - fabrics=mlx,verbs
      - cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
    hdf5:
      require:
      - +mpi+fortran+hl
    netcdf-c:
      require:
      - +mpi+parallel-netcdf
    fftw:
      require:
      - +mpi+openmp
      - precision=double,float
    openblas:
      require:
      - threads=openmp
    nccl:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
    gdrcopy:
      require:
      - +cuda
      - cuda_arch=75,80,86,87,89,90,90a,100,100a,100f,103,103a,103f,110,110a,110f,120,120a,120f,121,121a,121f
  view: false
  concretizer:
    unify: when_possible
  modules:
    default:
      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'
