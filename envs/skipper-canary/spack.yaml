# Full canary skipper environment.
spack:
  repos: []
  include:
  - path: ./locations.yaml
  - path: ../common/packages.yaml
  - path: ../common/modules.yaml
  - path: ../common/specs.yaml
  - path: ../common/rocky8
    optional: true
    when: os == "rocky8"
  - path: ../common/rocky9
    optional: true
    when: os == "rocky9"
  - path: ../common/macos
    optional: true
    when: platform == "darwin"
  config:
    deprecated: true
  specs:
  - $common_devtools_specs
  - $common_python_specs
  - $common_hpc_library_specs
  - $common_benchmark_specs
  - $linux_devtools_specs
  - $linux_debug_specs
  - $linux_benchmark_specs
  - $linux_profiling_specs
  - $rocky8_toolchain_specs
  - $rocky8_mpi_specs
  - $rocky8_benchmark_specs
  - $rocky8_profiling_specs
  - $rocky9_toolchain_specs
  - $rocky9_mpi_specs
  - $rocky9_gpu_specs
  - $rocky9_benchmark_specs
  - $rocky9_profiling_specs
  - $macos_toolchain_specs
  - $macos_mpi_specs
  - $macos_benchmark_specs
  - $macos_profiling_specs
  view: false
  concretizer:
    unify: when_possible
