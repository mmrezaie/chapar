# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
#
spack:
  repos: []
  include:
  - path: ../common/specs.yaml
  - path: ./rocky8
    optional: true
    when: os == "rocky8"
  - path: ./rocky9
    optional: true
    when: os == "rocky9"
  - path: ./macos
    optional: true
    when: platform == "darwin"
  config:
    install_tree:
      root: /share/base/bin  # Replace with your desired path
    template_dirs:
    - /share/base/templates
    build_stage: /tmp/$user/skipper-stage
    install_missing: true
    deprecated: true
#  set:
#    install_tree:
#      root: /share/base/bin
#    build_stage: /share/base/bin/stage
#    TMPDIR: /tmp/$user/skipper-stage

  # add package specs to the `specs` list
  specs:
  - $common_specs
  - $linux_specs
  - $rocky8_specs
  - $rocky9_specs
  - $macos_specs
  packages:
    all:
      providers:
        mpi: [openmpi, intel-oneapi-mpi]
        blas: [openblas]
        lapack: [openblas]
        scalapack: [netlib-scalapack]
  view: false
  concretizer:
    unify: when_possible
  modules:
    default:
      roots:
        tcl: /share/base/modulefiles
        lmod: /share/base/lmods

      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'
