# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
#
spack:
  repos: []
  include:
  - path: ./rocky8
    optional: true
    when: os == "rocky8"
  - path: ./rocky9
    optional: true
    when: os == "rocky9"
  - path: ./macos
    optional: true
    when: platform == "darwin"
  config:
    install_tree:
      root: /share/base/bin  # Replace with your desired path
    template_dirs:
    - /share/base/templates
    build_stage: /tmp/$user/skipper-stage
    install_missing: true
    deprecated: true
#  set:
#    install_tree:
#      root: /share/base/bin
#    build_stage: /share/base/bin/stage
#    TMPDIR: /tmp/$user/skipper-stage

  # add package specs to the `specs` list
  definitions:
  - mpis: [openmpi, intel-oneapi-mpi]
  - compilers: [gcc@13.4.0, gcc@14.3.0, gcc@15.2.0, intel-oneapi-compilers]
  specs:
  - gcc@13.4.0+profiled
  - gcc@14.3.0+profiled
  - gcc@15.2.0+profiled
  - ucx@1.16.0+cuda+dc+rc+rdmacm+thread_multiple+ud+verbs+xpmem
  - libfabric@1.22.0 fabrics=mlx,verbs
  - tmux
  - tcl
  - tk
  - python@3.8:3.8+optimizations+tkinter
  - python@3.10:3.10+optimizations+tkinter
  - python@3.11:3.11+optimizations+tkinter
  - python@3.12:3.12+optimizations+tkinter
  - intel-oneapi-mpi@2021.14.0+generic-names
  - intel-oneapi-mpi@2021.10.0+generic-names
  - intel-oneapi-compilers@2024.1.0
  - intel-oneapi-compilers@2023.1.0
  - hpctoolkit@2024.01.stable+cuda+mpi+python
  - autoconf
  - pulseaudio@13.0 ^fftw~mpi
  - imagemagick@7.1.1-39
  - numactl
  packages:
    all:
      providers:
        mpi: [openmpi, intel-oneapi-mpi]
  view: false
  concretizer:
    unify: when_possible
  modules:
    default:
      roots:
        tcl: /share/base/modulefiles
        lmod: /share/base/lmods

      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'
