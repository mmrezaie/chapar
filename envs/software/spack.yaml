  specs: []

  packages:
    all:
      providers:
        mpi: [openmpi]
        blas: [openblas]
        lapack: [openblas]
        libllvm: [llvm]
        scalapack: [netlib-scalapack]
    adios2:
      require:
      - ~mgard
      - spec: ldflags="-Wl,--allow-shlib-undefined"
        when: platform=linux
    c:
      require:
      - spec: gcc@15
        when: os=ubuntu24.04
    cmake:
      require:
      - ~qtgui
    cxx:
      require:
      - spec: gcc@15
        when: os=ubuntu24.04
    darshan-runtime:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    dyninst:
      require:
      - spec: 'cxxflags="-include cstdint"'
        when: 'platform=linux %gcc@15:'
    elfutils:
      require:
      - ~debuginfod~nls
    extrae:
      require:
      - spec: 'cflags="-std=gnu17 -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-pointer-types"'
        when: 'platform=linux %gcc@15:'
    fontconfig:
      require:
      - spec: '@2.15:'
        when: platform=linux
    fortran:
      require:
      - spec: gcc@15
        when: os=ubuntu24.04
    gcc:
      require:
      - spec: +profiled
        when: '@15 platform=linux'
    gdrcopy:
      require:
      - +cuda
    glib:
      require:
      - spec: +introspection
        when: platform=linux
    hdf5:
      require:
      - +mpi+fortran+hl+threadsafe
      - spec: '%gcc@15'
        when: platform=linux
    hpctoolkit:
      require:
      - spec: ~opencl~level_zero
        when: platform=linux
    hwloc:
      require:
      - spec: +cuda
        when: platform=linux
      - spec: ~nvml
      - spec: ~opencl
        when: platform=linux
    intel-mpi-benchmarks:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    ior:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libfabric:
      require:
      - spec: '@2'
        when: platform=linux
      - spec: +cuda+gdrcopy fabrics=mlx,rxm,verbs
        when: platform=linux
    libffi:
      require:
      - one_of: ['@3.2.1', '@3.4.7:']
    libpressio:
      require:
      - spec: cxxflags="-include algorithm"
        when: '%gcc@15:'
    libsndfile:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libtool:
      require:
      - '@2.4.7:'
    llvm:
      require:
      - '@21'
      - +clang+lld~lldb~flang~polly~ipo build_system=cmake
    mpip:
      require:
      - spec: '+setjmp~libunwind cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration"'
        when: platform=linux
    ncview:
      require:
      - spec: 'cflags="-std=gnu17 -Wno-incompatible-pointer-types"'
        when: 'platform=linux %gcc@15:'
    netcdf-c:
      require:
      - +mpi+parallel-netcdf
      - spec: '%gcc@15'
        when: platform=linux
    netcdf-fortran:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    node-js:
      require:
      - '@24.2.0'
      - '~debug~doc~icu4c+openssl+zlib'
    npm:
      require:
      - '@11.2.0'
    openblas:
      require:
      - threads=openmp
    openmpi:
      require:
      - '@5:'
      - spec: +cuda+fortran~internal-hwloc~internal-pmix fabrics=verbs,ucx schedulers=slurm ^pmix@6
        when: platform=linux
    parallel-netcdf:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    pmix:
      require:
      - '@6'
    python:
      require:
      - one_of: ['python@3.10:3.10', 'python@3.11:3.11', 'python@3.12:3.12']
    rdma-core:
      require:
      - ~pyverbs
    scalasca:
      require:
      - ^openmpi
    seacas:
      require:
      - spec: ldflags="-Wl,--allow-shlib-undefined"
        when: '+adios2 platform=linux'
    scorep:
      require:
      - +fortran
      - ~gcc-plugin
      - spec: '@9.4:'
        when: platform=linux
      - spec: '^binutils libs=shared'
        when: '+binutils platform=linux'
      - spec: 'cflags="-Wno-error=implicit-int -Wno-error=implicit-function-declaration"'
        when: 'platform=linux %gcc@15:'
      - spec: '~cuda'
        when: platform=linux
    sz:
      require:
      - +fortran+hdf5+netcdf+openmp
    tau:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: cxxflags="-include omp.h"
        when: '+openmp %gcc@15:'
    ucx:
      require:
      - spec: +cuda+gdrcopy
        when: platform=linux
      - spec: +dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
        when: platform=linux
    zlib-api:
      require:
      - zlib-ng+compat

  modules:
    default:
      enable:
      - tcl
      tcl:
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'

  config:
    deprecated: true
    install_missing: true

  view: false
  concretizer:
    unify: when_possible
    duplicates:
      max_dupes:
        libffi: 2
        py-cython: 3
        py-flit-core: 3
        py-pip: 3
        py-setuptools: 3
        py-wheel: 3
        python: 3
        python-venv: 3
