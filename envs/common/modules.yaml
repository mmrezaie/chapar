modules:
  default:
    enable:
    - tcl
    tcl:
      projections:
        all: '{name}/{version}'
        meson: '{name}/{version}-{hash:7}'
      hash_length: 0
      exclude_implicits: true
      pulseaudio:
        environment:
          prepend_path:
            LD_LIBRARY_PATH: '{prefix}/lib'
