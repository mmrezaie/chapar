packages:
  all:
    require: "%gcc@11.5.0"
    target: [x86_64_v4]
  openmpi:
    require:
    - +cuda
    - fabrics=verbs,ucx
    - schedulers=none
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - ^ucx@1.19.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  intel-oneapi-mpi:
    require:
    - +external-libfabric
    - ^libfabric@1.22.0~cuda fabrics=mlx,verbs
  ucx:
    require:
    - +cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  libfabric:
    require:
    - ~cuda
    - fabrics=mlx,verbs
  cuda:
    require:
    - '@13.0.2'
  hdf5:
    require:
    - +mpi+fortran+hl
  netcdf-c:
    require:
    - +mpi+parallel-netcdf
  openblas:
    require:
    - threads=openmp
  babelstream:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  nccl:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  nccl-tests:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  nvshmem:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  nvbandwidth:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  nvtop:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  caliper:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  hwloc:
    require:
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  gdrcopy:
    require:
    - +cuda
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
