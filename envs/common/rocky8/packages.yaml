packages:
  all:
    target: [x86_64_v4]
  openmpi:
    require:
    - fabrics=verbs,ucx,ofi
    - schedulers=none
    - ^ucx@1.16.0~cuda+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
    - ^libfabric@1.22.0~cuda fabrics=mlx,verbs
  intel-oneapi-mpi:
    require:
    - +external-libfabric
    - ^libfabric@1.22.0~cuda fabrics=mlx,verbs
  ucx:
    require:
    - ~cuda+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
  libfabric:
    require:
    - ~cuda
    - fabrics=mlx,verbs
  libffi:
    require:
    - '@3.2.1'
  elfutils:
    require:
    - ~debuginfod~nls
  scorep:
    require:
    - ~gcc-plugin
  scalasca:
    require:
    - ^openmpi
  hwloc:
    require:
    - ~nvml
  hdf5:
    require:
    - +mpi+fortran+hl
  netcdf-c:
    require:
    - +mpi+parallel-netcdf
  openblas:
    require:
    - threads=openmp
