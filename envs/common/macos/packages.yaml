packages:
  all:
    providers:
      mpi: [openmpi]
    target: [aarch64, armv8.5a]
  openmpi:
    require:
    - fabrics=ofi
    - schedulers=none
    - ^libfabric@1.22.0 fabrics=tcp,sockets,udp
  libfabric:
    require:
    - fabrics=tcp,sockets,udp
  libffi:
    require:
    - '@3.4.7:'
  hdf5:
    require:
    - +mpi+fortran+hl
  fftw:
    require:
    - +mpi+openmp
  netcdf-c:
    require:
    - +mpi+parallel-netcdf
  openblas:
    require:
    - threads=openmp
