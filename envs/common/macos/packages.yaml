packages:
  all:
    providers:
      mpi: [openmpi]
    target: [aarch64, armv8.5a]
  openmpi:
    require:
    - fabrics=ofi
    - schedulers=none
    - ^libfabric@1.22.0 fabrics=tcp,sockets,udp
  libfabric:
    require:
    - fabrics=tcp,sockets,udp
  libffi:
    require:
    - '@3.4.7:'
  py-pip:
    require:
    - ^python@3.12:3.12~optimizations~tkinter
  py-setuptools:
    require:
    - ^python@3.12:3.12~optimizations~tkinter
  py-wheel:
    require:
    - ^python@3.12:3.12~optimizations~tkinter
  python-venv:
    require:
    - ^python@3.12:3.12~optimizations~tkinter
  hdf5:
    require:
    - +mpi+fortran+hl
  fftw:
    require:
    - +mpi+openmp
  netcdf-c:
    require:
    - +mpi+parallel-netcdf
  openblas:
    require:
    - threads=openmp
  babelstream:
    require:
    - '%c,fortran=gcc'
  hpcg:
    require:
    - '%cxx=gcc'
  hpl:
    require:
    - '%c=gcc'
  intel-mpi-benchmarks:
    require:
    - '%c,cxx=gcc'
  stream:
    require:
    - '%c,fortran=gcc'
