packages:
  boost:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  c:
    require:
    - spec: gcc@15
      when: os=rocky8
  cxx:
    require:
    - spec: gcc@15
      when: os=rocky8
  darshan-runtime:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
    - spec: 'cflags="-std=gnu17"'
      when: 'platform=linux %gcc@15:'
  dyninst:
    require:
    - spec: 'cxxflags="-include cstdint"'
      when: 'os=rocky8 %gcc@15:'
  fortran:
    require:
    - spec: gcc@15
      when: os=rocky8
  gdrcopy:
    require:
    - spec: '%gcc@15'
      when: '+cuda os=rocky8'
  hdf5:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  hwloc:
    require:
    - spec: ~opencl
      when: os=rocky8
    - spec: '%gcc@15'
      when: '+cuda os=rocky8'
  intel-mpi-benchmarks:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  ior:
    require:
    - spec: 'cflags="-std=gnu17"'
      when: 'os=rocky8 %gcc@15:'
  libfabric:
    require:
    - spec: '%gcc@15'
      when: '+cuda os=rocky8'
  librsvg:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  libsndfile:
    require:
    - spec: 'cflags="-std=gnu17"'
      when: 'os=rocky8 %gcc@15:'
  libstdcompat:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  ncview:
    require:
    - spec: 'cflags="-std=gnu17"'
      when: 'os=rocky8 %gcc@15:'
  netcdf-c:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  netcdf-fortran:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  node-js:
    require:
    - spec: '%gcc@15'
      when: '@24.2.0 os=rocky8'
  npm:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  openmpi:
    require:
    - spec: '~internal-hwloc %gcc@15'
      when: os=rocky8
  parallel-netcdf:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
  tau:
    require:
    - spec: '~pdt %gcc@15'
      when: os=rocky8
  ucx:
    require:
    - spec: '%gcc@15'
      when: '+cuda os=rocky8'
  vtk-m:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
    - spec: 'cxxflags="-include cstdint -Wno-template-body"'
      when: os=rocky8
  z3:
    require:
    - spec: '%gcc@15'
      when: os=rocky8
