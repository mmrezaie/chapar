packages:
  adios2:
    require:
    - ~mgard
    # libfabric keeps CUDA/GDR enabled; driver libraries resolve on GPU nodes.
    - spec: ldflags="-Wl,--allow-shlib-undefined"
      when: platform=linux
  elfutils:
    require:
    - ~debuginfod~nls
  # fides policy disabled with the fides root for the current cluster build.
  # fides:
  #   require:
  #   - spec: ldflags=-Wl,--allow-shlib-undefined
  fontconfig:
    require:
    - spec: '@2.15:'
      when: platform=linux
  gcc:
    require:
    - spec: +profiled
      when: "@15 platform=linux"
  gdrcopy:
    require:
    - +cuda
    - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  glib:
    require:
    - spec: +introspection
      when: platform=linux
  hwloc:
    require:
    - spec: +cuda
      when: platform=linux
  hpctoolkit:
    require:
    - spec: ~opencl~level_zero
      when: platform=linux
  # Visualization package policies disabled with visualization roots.
  # libepoxy:
  #   require:
  #   - spec: '+glx ^[virtuals=gl] glx'
  # llvm-amdgpu:
  #   require:
  #   - spec: ^cmake@:3
  #     when: platform=linux
  libfabric:
    require:
    - spec: "@2"
      when: platform=linux
    - spec: +cuda+gdrcopy fabrics=mlx,verbs
      when: platform=linux
    - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
      when: "+cuda platform=linux"
  libpressio:
    require:
    - spec: cxxflags="-include algorithm"
      when: "%gcc@15:"
  # mesa:
  #   require:
  #   - spec: +llvm
  #     when: +osmesa platform=linux
  # mfem:
  #   require:
  #   - spec: cxxstd=17
  #     when: platform=linux
  openmpi:
    require:
    - spec: +cuda+fortran~internal-pmix fabrics=verbs,ucx schedulers=slurm ^pmix@6
      when: platform=linux
    - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
      when: "+cuda platform=linux"
  rdma-core:
    require:
    - ~pyverbs
  # paraview:
  #   require:
  #   - spec: ldflags="-Wl,--allow-shlib-undefined"
  #     when: +adios2 platform=linux
  scalasca:
    require:
    - ^openmpi
  seacas:
    require:
    - spec: "^libcatalyst~conduit"
      when: "+libcatalyst platform=linux"
    - spec: ldflags="-Wl,--allow-shlib-undefined"
      when: +adios2 platform=linux
  scorep:
    require:
    - +fortran
    - ~gcc-plugin
  sz:
    require:
    - +fortran+hdf5+netcdf+openmp
  tau:
    require:
    - spec: cxxflags="-include omp.h"
      when: "+openmp %gcc@15:"
  ucx:
    require:
    - spec: +cuda+gdrcopy
      when: platform=linux
    - spec: +dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
      when: platform=linux
    - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
      when: "+cuda platform=linux"
  # visit:
  #   require:
  #   - spec: cxxflags="-std=c++17"
  #     when: +mfem platform=linux
  #   - spec: ldflags="-Wl,--allow-shlib-undefined"
  #     when: +adios2 platform=linux
  # vtk:
  #   require:
  #   - spec: ldflags="-Wl,--allow-shlib-undefined"
  #     when: io=adios2 platform=linux
