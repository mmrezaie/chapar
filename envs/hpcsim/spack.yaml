# Shared HPC simulation environment entry point.
#
# Keep root spec groups and package policy in included config scopes. Shared
# policy belongs in common/ or linux/; OS-specific overrides belong in rocky8/,
# rocky9/, or macos/.
spack:
  repos: []

  include:
  - path: rocky8
    when: os == "rocky8"
  - path: rocky9
    when: os == "rocky9"
  - path: macos
    when: platform == "darwin"
  - path: linux
    when: platform == "linux"
  - path: common

  specs:
  - $devtools_specs
  - $python_specs
  - $hpc_library_specs
  - $toolchain_specs
  - $mpi_specs
  - $gpu_specs
  - $debug_specs
  - $benchmark_specs
  - $profiling_specs
  - $visualization_core_specs
  - $visualization_specs
  - $postprocessing_io_specs
  - $postprocessing_cli_specs
  - $insitu_specs

  modules:
    default:
      enable:
      - tcl
      tcl:
        # hpcsim module names are user-facing and must stay name/version only.
        # If root specs collide, fix the roots instead of adding hash suffixes.
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'

  config:
    deprecated: true
    install_missing: true

  view: false
  concretizer:
    unify: when_possible
    duplicates:
      max_dupes:
        libffi: 2
