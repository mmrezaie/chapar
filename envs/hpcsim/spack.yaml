# hpcsim is the Chapar Rocky Linux simulation environment.
#
# Keep the environment readable in this one file. Site paths, shared cache
# roots, ccache roots, and publication choices are intentionally not stored
# here; copy envs/hpcsim/hpcsim-site.env.example to
# envs/hpcsim/hpcsim-site.env instead.
spack:
  repos: []

  definitions:
  - devtools_specs:
    - autoconf
    - cmake
    - ninja
    - meson
    - pkgconf
    - 'libffi@3.4.7:'
    - libffi@3.2.1
    - neovim
    - tmux
    - tcl
    - tk
    - imagemagick@7.1.1-39 ^python@3.12:3.12+optimizations+tkinter
    - npm@11.2.0
    - numactl
    - pulseaudio@13.0 %gcc ^fftw~mpi
  - python_specs:
    - python@3.10:3.10+optimizations+tkinter
    - python@3.11:3.11+optimizations+tkinter
    - python@3.12:3.12+optimizations+tkinter
    # - python@3.13:3.13+optimizations+tkinter
    # - python@3.14.0+optimizations+tkinter
  - hpc_library_specs:
    - fftw+mpi+openmp precision=double,float %gcc
    - hdf5+mpi+fortran+hl
    - netcdf-c+mpi+parallel-netcdf
    - netcdf-fortran
    - netlib-scalapack
    - openblas threads=openmp %gcc
    - parallel-netcdf
  - toolchain_specs:
    # GCC 15 is the only hpcsim compiler stack for Rocky 9 and Rocky 10.
    # The gcc package itself is bootstrapped with the OS compiler.
    - gcc@15+profiled %gcc
    - cuda@13
  - mpi_specs:
    - intel-oneapi-mpi@2021.17.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    # - intel-oneapi-mpi@2021.14.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    # - intel-oneapi-mpi@2021.10.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    - libfabric@2+cuda+gdrcopy fabrics=mlx,rxm,verbs ^cuda@13
    - pmix@6
    - ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^cuda@13
    # Non-Slurm OpenMPI root disabled for the current cluster build.
    # - openmpi@5+cuda+fortran fabrics=verbs,ucx schedulers=none cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^cuda@13
    - openmpi@5+cuda+fortran~internal-pmix fabrics=verbs,ucx schedulers=slurm cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^pmix@6 ^ucx@1.20.1+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^cuda@13
  - gpu_specs:
    - cuda-memtest
    - nccl@2.29.7-1 cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - nvbandwidth+cuda cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - nvshmem+cuda+mpi+ucx+libfabric+nccl cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^nccl@2.29.7-1 cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - nvtop+cuda support=nvidia cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
  - debug_specs:
    - gdb+python ^python@3.12:3.12+tkinter
    - valgrind+mpi
  - benchmark_specs:
    - babelstream+cuda cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - fio
    - h5bench+exerciser+metadata
    - hpcg+openmp
    - hpl+openmp
    - intel-mpi-benchmarks@2021.7
    - ior+hdf5+ncmpi
    - mdtest
    - nccl-tests+mpi+cuda cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^nccl@2.29.7-1 cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - osu-micro-benchmarks@7.5.2
    - qperf+verbs
    - stream+openmp
  - profiling_specs:
    - caliper+mpi+papi+cuda+libunwind+libdw cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - darshan-runtime+mpi+hdf5+parallel-netcdf
    - hpctoolkit@2026.0.1+cuda+mpi+python+papi+viewer~docs~opencl~level_zero~rocm~auditor_default build_system=meson ^python@3.12:3.12+tkinter
    - hwloc+cuda+pci~nvml cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - likwid
    # Disabled for the current cluster build: nvtx~python still enters the
    # recipe's pip path, while nvtx+python fails on generated char8_t headers.
    # - nvtx~python %gcc@15
    - papi+infiniband+cuda
    - scalasca
    # ~cuda avoids Spack's scorep recipe bug: --with-libcuda-lib given
    # without --with-libcuda-include. Same workaround as vlad env.
    - scorep+mpi+papi~cuda
    - tau+mpi+papi+openmp~cuda
  - visualization_core_specs:
    - ffmpeg %gcc
    # Other visualization roots are disabled for the current cluster build.
    # - gtkplus %gcc
    # - llvm@21+clang+lld~lldb~flang~polly~ipo build_system=cmake targets=x86,nvptx %gcc
    # - mesa+llvm+osmesa+glx %gcc
    # - qt-base+gui+opengl %gcc ^[virtuals=gl] glx
  - visualization_specs: []
    # Disabled for the current cluster build; keep these roots visible for future rebuilds.
    # - paraview@5.13.3+mpi~python+fortran+hdf5+adios2+fides+catalyst+libcatalyst~qt use_vtkm=on %gcc ^openmpi@5 ^[virtuals=gl] osmesa
    # - visit~gui+mpi+python+adios2+hdf5+netcdf+silo+conduit+vtkm %gcc ^openmpi@5 ^[virtuals=gl] osmesa ^python@3.11:3.11
    # - vtk+mpi io=adios2,cgns,exodusii,ffmpeg,fides,ioss,netcdf,xdmf %gcc ^openmpi@5 ^[virtuals=gl] osmesa
    # - vtk-m+mpi+openmp+shared %gcc ^openmpi@5
  - postprocessing_io_specs:
    # Catalyst-enabled variants are disabled in the current cluster build.
    # - adios2+mpi+fortran+hdf5+libcatalyst~python %gcc ^openmpi@5
    - adios2+mpi+fortran+hdf5~libcatalyst~python %gcc ^openmpi@5
    - cgns+mpi+hdf5+fortran %gcc ^openmpi@5
    - exodusii+mpi+fortran %gcc ^openmpi@5
    # - seacas@2024-06-27+mpi+adios2+libcatalyst+cgns+applications~legacy~x11 %gcc ^openmpi@5
    - seacas@2025-10-14+mpi+adios2~fortran~libcatalyst+cgns+applications~legacy~x11 %gcc@15 ^openmpi@5
    - silo+mpi+hdf5+fortran~python %gcc ^openmpi@5
  - postprocessing_cli_specs:
    - cdo+netcdf+hdf5+openmp grib2=eccodes %gcc
    - eccodes+tools+netcdf+png %gcc
    - nccmp %gcc
    - nco+openmp %gcc
    - ncview %gcc
  - insitu_specs:
    # Disabled for the current cluster build; keep these roots visible for future rebuilds.
    # - conduit+mpi+hdf5+fortran~python %gcc ^openmpi@5
    # - fides+mpi %gcc ^openmpi@5
    # - libcatalyst+mpi+conduit+fortran~python %gcc ^openmpi@5
    - hdf5-vol-async %gcc ^openmpi@5
    - libpressio+mpi+openmp+hdf5+zfp+netcdf~python %gcc ^openmpi@5
    - sz+openmp+hdf5+netcdf+fortran %gcc
    - zfp+openmp+fortran %gcc

  specs:
  - $devtools_specs
  - $python_specs
  - $hpc_library_specs
  - $toolchain_specs
  - $mpi_specs
  - $gpu_specs
  - $debug_specs
  - $benchmark_specs
  - $profiling_specs
  - $visualization_core_specs
  - $visualization_specs
  - $postprocessing_io_specs
  - $postprocessing_cli_specs
  - $insitu_specs

  packages:
    all:
      providers:
        mpi: [openmpi]
        blas: [openblas]
        lapack: [openblas]
        libllvm: [llvm]
        scalapack: [netlib-scalapack]
    adios2:
      require:
      - ~mgard
      # libfabric keeps CUDA/GDR enabled; driver libraries resolve on GPU nodes.
      - spec: ldflags="-Wl,--allow-shlib-undefined"
        when: platform=linux
    c:
      require:
      - spec: gcc@15
        when: os=rocky9
      - spec: gcc@15
        when: os=rocky10
    cmake:
      require:
      - ~qtgui
    cxx:
      require:
      - spec: gcc@15
        when: os=rocky9
      - spec: gcc@15
        when: os=rocky10
    darshan-runtime:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    dyninst:
      require:
      - spec: 'cxxflags="-include cstdint"'
        when: 'platform=linux %gcc@15:'
    elfutils:
      require:
      - ~debuginfod~nls
    # fides policy disabled with the fides root for the current cluster build.
    # fides:
    #   require:
    #   - spec: ldflags=-Wl,--allow-shlib-undefined
    fontconfig:
      require:
      - spec: '@2.15:'
        when: platform=linux
    fortran:
      require:
      - spec: gcc@15
        when: os=rocky9
      - spec: gcc@15
        when: os=rocky10
    gcc:
      require:
      - spec: +profiled
        when: '@15 platform=linux'
    gdrcopy:
      require:
      - +cuda
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    glib:
      require:
      - spec: +introspection
        when: platform=linux
    hdf5:
      require:
      - +mpi+fortran+hl+threadsafe
      - spec: '%gcc@15'
        when: platform=linux
    hpctoolkit:
      require:
      - spec: ~opencl~level_zero
        when: platform=linux
    hwloc:
      require:
      - spec: +cuda
        when: platform=linux
      - spec: ~nvml
      - spec: ~opencl
        when: platform=linux
    intel-mpi-benchmarks:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    ior:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    # Visualization package policies disabled with visualization roots.
    # libepoxy:
    #   require:
    #   - spec: '+glx ^[virtuals=gl] glx'
    # llvm-amdgpu:
    #   require:
    #   - spec: ^cmake@:3
    #     when: platform=linux
    libfabric:
      require:
      - spec: '@2'
        when: platform=linux
      - spec: +cuda+gdrcopy fabrics=mlx,rxm,verbs
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
        when: '+cuda platform=linux'
    libffi:
      require:
      - one_of: ['@3.2.1', '@3.4.7:']
    libpressio:
      require:
      - spec: cxxflags="-include algorithm"
        when: '%gcc@15:'
    libsndfile:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    libtool:
      require:
      - '@2.4.7:'
    llvm:
      require:
      - '@21'
      - +clang+lld~lldb~flang~polly~ipo build_system=cmake targets=x86,nvptx
    # mesa:
    #   require:
    #   - spec: +llvm
    #     when: +osmesa platform=linux
    # mfem:
    #   require:
    #   - spec: cxxstd=17
    #     when: platform=linux
    nccl:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nccl-tests:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    ncview:
      require:
      - spec: 'cflags="-std=gnu17 -Wno-incompatible-pointer-types"'
        when: 'platform=linux %gcc@15:'
    netcdf-c:
      require:
      - +mpi+parallel-netcdf
      - spec: '%gcc@15'
        when: platform=linux
    netcdf-fortran:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    node-js:
      require:
      - '@24.2.0'
      - '~debug~doc~icu4c+openssl+zlib'
    npm:
      require:
      - '@11.2.0'
    nvbandwidth:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nvshmem:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nvtop:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    openblas:
      require:
      - threads=openmp
    openmpi:
      require:
      - '@5:'
      - spec: +cuda+fortran~internal-hwloc~internal-pmix fabrics=verbs,ucx schedulers=slurm ^pmix@6
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
        when: '+cuda platform=linux'
    parallel-netcdf:
      require:
      - spec: '%gcc@15'
        when: platform=linux
    pmix:
      require:
      - '@6'
    python:
      require:
      - one_of: ['python@3.10:3.10', 'python@3.11:3.11', 'python@3.12:3.12']
    rdma-core:
      require:
      - ~pyverbs
    # paraview:
    #   require:
    #   - spec: ldflags="-Wl,--allow-shlib-undefined"
    #     when: +adios2 platform=linux
    scalasca:
      require:
      - ^openmpi
    seacas:
      require:
      - spec: ldflags="-Wl,--allow-shlib-undefined"
        when: '+adios2 platform=linux'
    scorep:
      require:
      - +fortran
      - ~gcc-plugin
    sz:
      require:
      - +fortran+hdf5+netcdf+openmp
    tau:
      require:
      - spec: '%gcc@15'
        when: platform=linux
      - spec: cxxflags="-include omp.h"
        when: '+openmp %gcc@15:'
    ucx:
      require:
      - spec: +cuda+gdrcopy
        when: platform=linux
      - spec: +dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
        when: '+cuda platform=linux'
    # visit:
    #   require:
    #   - spec: cxxflags="-std=c++17"
    #     when: +mfem platform=linux
    #   - spec: ldflags="-Wl,--allow-shlib-undefined"
    #     when: +adios2 platform=linux
    # vtk:
    #   require:
    #   - spec: ldflags="-Wl,--allow-shlib-undefined"
    #     when: io=adios2 platform=linux
    # vtk-m:
    #   require:
    #   - spec: '%gcc@15'
    #     when: platform=linux
    #   - spec: 'cxxflags="-include cstdint -Wno-template-body"'
    #     when: platform=linux
    zlib-api:
      require:
      - zlib-ng+compat

  modules:
    default:
      enable:
      - tcl
      tcl:
        # hpcsim module names are user-facing and must stay name/version only.
        # If root specs collide, fix the roots instead of adding hash suffixes.
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'

  config:
    deprecated: true
    install_missing: true

  view: false
  concretizer:
    unify: when_possible
    duplicates:
      max_dupes:
        libffi: 2
        py-cython: 3
        py-flit-core: 3
        py-pip: 3
        py-setuptools: 3
        py-wheel: 3
        python: 3
        python-venv: 3
