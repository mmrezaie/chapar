# Single shared HPC simulation environment.
#
# Keep the package list here. OS-specific entries should stay conditional and
# limited to real platform differences, not release or section differences.
spack:
  repos: []

  definitions:
  - common_devtools_specs:
    - autoconf
    - cmake
    - ninja
    - meson
    - pkgconf
    - libffi
    - neovim
    - tmux
    - tcl
    - tk
    - imagemagick@7.1.1-39
  - common_python_specs:
    - python@3.10:3.10+optimizations+tkinter
    - python@3.11:3.11+optimizations+tkinter
    - python@3.12:3.12+optimizations+tkinter
    - python@3.13:3.13+optimizations+tkinter
    - python@3.14.0+optimizations+tkinter
  - common_hpc_library_specs:
    - fftw+mpi+openmp precision=double,float %gcc
    - hdf5+mpi+fortran+hl
    - parallel-netcdf
    - netcdf-c+mpi+parallel-netcdf
    - netcdf-fortran
  - linux_hpc_library_specs:
    - netlib-scalapack
    - openblas threads=openmp %gcc
    when: platform == "linux"
  - linux_devtools_specs:
    - npm@11.2.0
    - numactl
    - pulseaudio@13.0 %gcc ^fftw~mpi
    when: platform == "linux"
  - linux_debug_specs:
    - gdb+python
    - valgrind+mpi
    when: platform == "linux"
  - linux_benchmark_specs:
    - hpl+openmp
    - hpcg+openmp
    - stream+openmp
    - intel-mpi-benchmarks
    - qperf+verbs
    - ior+hdf5+ncmpi
    - mdtest
    - h5bench+exerciser+metadata
    - fio
    when: platform == "linux"
  - linux_profiling_specs:
    - likwid
    - scalasca
    - tau+mpi+papi+openmp~cuda
    - darshan-runtime+mpi+hdf5+parallel-netcdf
    - darshan-util
    when: platform == "linux"
  - linux_visualization_core_specs:
    - llvm@21+clang+lld~lldb~flang~polly~ipo build_system=cmake targets=x86,nvptx %gcc
    - mesa+llvm+osmesa+glx %gcc
    - qt-base+gui+opengl %gcc ^[virtuals=gl] glx
    - gtkplus %gcc
    - ffmpeg %gcc
    when: platform == "linux"
  - linux_visualization_specs:
    - paraview@5.13.3+mpi~python+fortran+hdf5+adios2+fides+catalyst+libcatalyst~qt use_vtkm=on %gcc ^openmpi@5 ^[virtuals=gl] osmesa
    - visit~gui+mpi+python+adios2+hdf5+netcdf+silo+conduit+vtkm %gcc ^openmpi@5 ^[virtuals=gl] osmesa ^python@3.11:3.11
    - vtk+mpi io=adios2,cgns,exodusii,ffmpeg,fides,ioss,netcdf,xdmf %gcc ^openmpi@5 ^[virtuals=gl] osmesa
    - vtk-m+mpi+openmp+shared %gcc ^openmpi@5
    when: platform == "linux"
  - linux_postprocessing_io_specs:
    - adios2+mpi+fortran+hdf5+libcatalyst~python %gcc ^openmpi@5
    - cgns+mpi+hdf5+fortran %gcc ^openmpi@5
    - silo+mpi+hdf5+fortran~python %gcc ^openmpi@5
    - exodusii+mpi+fortran %gcc ^openmpi@5
    - seacas@2024-06-27+mpi+adios2+libcatalyst+cgns+applications~legacy~x11 %gcc ^openmpi@5
    when: platform == "linux"
  - linux_postprocessing_cli_specs:
    - nco+openmp %gcc
    - cdo+netcdf+hdf5+openmp grib2=eccodes %gcc
    - eccodes+tools+netcdf+png %gcc
    - nccmp %gcc
    - ncview %gcc
    when: platform == "linux"
  - linux_insitu_specs:
    - libcatalyst+mpi+conduit+fortran~python %gcc ^openmpi@5
    - ascent+mpi~python+fortran+vtkh+adios2+fides %gcc ^openmpi@5
    - conduit+mpi+hdf5+fortran~python %gcc ^openmpi@5
    - fides+mpi %gcc ^openmpi@5
    - hdf5-vol-async %gcc ^openmpi@5
    - sz+openmp+hdf5+netcdf+fortran %gcc
    - zfp+openmp+fortran %gcc
    - libpressio+mpi+openmp+hdf5+zfp+netcdf~python %gcc ^openmpi@5
    when: platform == "linux"
  - rocky8_toolchain_specs:
    - gcc@13.4.0+profiled %gcc
    - gcc@14.3.0+profiled %gcc
    - gcc@15+profiled %gcc
    when: os == "rocky8"
  - rocky8_mpi_specs:
    - ucx@1.19.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^cuda@13
    - libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    - openmpi@5+cuda+fortran fabrics=verbs,ucx schedulers=none cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^ucx@1.19.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^cuda@13
    - intel-oneapi-mpi@2021.17.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    - intel-oneapi-mpi@2021.14.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    - intel-oneapi-mpi@2021.10.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    when: os == "rocky8"
  - rocky8_benchmark_specs:
    - osu-micro-benchmarks
    when: os == "rocky8"
  - rocky8_profiling_specs:
    - hpctoolkit@2024.01.stable~cuda+mpi+python
    - hpctoolkit@2025.0.1~cuda+mpi+python~auditor_default
    - papi+infiniband
    - scorep~cuda+mpi+papi
    - caliper+cuda+mpi+papi+libunwind+libdw cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^cuda@13
    - hwloc+cuda+pci~nvml cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    when: os == "rocky8"
  - rocky9_toolchain_specs:
    - gcc@13.4.0+profiled
    - gcc@14.3.0+profiled
    - gcc@15+profiled
    - cuda@13
    when: os == "rocky9"
  - rocky9_mpi_specs:
    - ucx@1.19.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    - openmpi@5+cuda+fortran fabrics=verbs,ucx schedulers=none cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^ucx@1.19.0+cuda+gdrcopy+dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - intel-oneapi-mpi@2021.17.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    - intel-oneapi-mpi@2021.14.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    - intel-oneapi-mpi@2021.10.0+generic-names+external-libfabric ^libfabric@2+cuda+gdrcopy fabrics=mlx,verbs ^cuda@13
    when: os == "rocky9"
  - rocky9_gpu_specs:
    - nccl@2.28.7-1 cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - nvshmem+cuda+mpi+ucx+libfabric+nccl cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^nccl@2.28.7-1 cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - nvbandwidth+cuda cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - cuda-memtest
    - nvtop+cuda support=nvidia cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    when: os == "rocky9"
  - rocky9_benchmark_specs:
    - osu-micro-benchmarks
    - babelstream+cuda cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - nccl-tests+mpi+cuda cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121 ^nccl@2.28.7-1 cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    when: os == "rocky9"
  - rocky9_profiling_specs:
    - hpctoolkit@2024.01.stable+cuda+mpi+python
    - hpctoolkit@2025.0.1+cuda+mpi+python~auditor_default
    - nvtx+python
    - papi+infiniband+cuda
    - scorep+mpi+papi+cuda
    - caliper+mpi+papi+cuda+libunwind+libdw cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    - hwloc+cuda+pci~nvml cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    when: os == "rocky9"
  - macos_toolchain_specs:
    - gcc@15
    when: platform == "darwin"
  - macos_devtools_specs:
    - npm@11.2.0 ^node-js@24.2.0
    when: platform == "darwin"
  - macos_mpi_specs:
    - libfabric@1.22.0 fabrics=tcp,sockets,udp
    - libfabric@2.3.1 fabrics=tcp,sockets,udp
    - openmpi@5 fabrics=ofi schedulers=none
    when: platform == "darwin"
  - macos_hpc_library_specs:
    - netlib-scalapack ^[virtuals=blas] veclibfort ^[virtuals=lapack] veclibfort
    when: platform == "darwin"
  - macos_benchmark_specs:
    - hpl+openmp %gcc ^[virtuals=blas] veclibfort
    - hpcg+openmp %gcc ^openmpi@5 fabrics=ofi schedulers=none ^libfabric@2.3.1 fabrics=tcp,sockets,udp
    - stream~openmp %gcc
    - intel-mpi-benchmarks %gcc
    - ior+hdf5+ncmpi
    - mdtest
    - h5bench+exerciser+metadata
    - osu-micro-benchmarks
    when: platform == "darwin"
  - macos_profiling_specs:
    - hwloc
    when: platform == "darwin"

  specs:
  - $common_devtools_specs
  - $common_python_specs
  - $common_hpc_library_specs
  - $linux_hpc_library_specs
  - $linux_devtools_specs
  - $linux_debug_specs
  - $linux_benchmark_specs
  - $linux_profiling_specs
  - $linux_visualization_core_specs
  - $linux_visualization_specs
  - $linux_postprocessing_io_specs
  - $linux_postprocessing_cli_specs
  - $linux_insitu_specs
  - $rocky8_toolchain_specs
  - $rocky8_mpi_specs
  - $rocky8_benchmark_specs
  - $rocky8_profiling_specs
  - $rocky9_toolchain_specs
  - $rocky9_mpi_specs
  - $rocky9_gpu_specs
  - $rocky9_benchmark_specs
  - $rocky9_profiling_specs
  - $macos_toolchain_specs
  - $macos_devtools_specs
  - $macos_mpi_specs
  - $macos_hpc_library_specs
  - $macos_benchmark_specs
  - $macos_profiling_specs

  packages:
    all:
      providers:
        mpi: [openmpi]
        blas: [openblas]
        lapack: [openblas]
        libllvm: [llvm]
        scalapack: [netlib-scalapack]
    adios2:
      require:
      # libfabric keeps CUDA/GDR enabled; driver libraries resolve on GPU nodes.
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: platform=linux
    ascent:
      require:
      # CUDA-aware libfabric records driver-library DT_NEEDED entries that are
      # intentionally satisfied on GPU nodes, not inside the build container.
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: '+adios2 platform=linux'
    c:
      require:
      - spec: gcc@15
        when: os=rocky8
      - spec: gcc@11
        when: os=rocky9
    cxx:
      require:
      - spec: gcc@15
        when: os=rocky8
      - spec: gcc@11
        when: os=rocky9
    fortran:
      require:
      - spec: gcc@15
        when: os=rocky8
      - spec: gcc@11
        when: os=rocky9
    gcc:
      require:
      - spec: +profiled
        when: '@15 platform=linux'
    glib:
      require:
      - spec: +introspection
        when: platform=linux
    zlib-api:
      require:
      - zlib-ng+compat
    cmake:
      require:
      - ~qtgui
    boost:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
    darshan-runtime:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: '%gcc@11'
        when: os=rocky9
      - spec: 'cflags="-std=gnu17"'
        when: 'platform=linux %gcc@15:'
    dyninst:
      require:
      - spec: 'cxxflags="-include cstdint"'
        when: 'os=rocky8 %gcc@15:'
    llvm:
      require:
      - '@21'
      - +clang+lld~lldb~flang~polly~ipo build_system=cmake targets=x86,nvptx
    llvm-amdgpu:
      require:
      - spec: ^cmake@:3
        when: platform=linux
    mesa:
      require:
      - spec: +llvm
        when: '+osmesa platform=linux'
      - spec: '%gcc@11'
        when: os=rocky9
    mfem:
      require:
      - spec: cxxstd=17
        when: platform=linux
    npm:
      require:
      - '@11.2.0'
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: '%gcc@15'
        when: os=rocky9
    node-js:
      require:
      - '@24.2.0'
      - spec: '%gcc@15'
        when: '@24.2.0 os=rocky8'
      - spec: '%gcc@15'
        when: '@24.2.0 os=rocky9'
      - spec: ^python@:3.13
        when: '@24.2.0'
    libtool:
      require:
      - '@2.4.7:'
    libffi:
      require:
      - '@3.4.7:'
    libepoxy:
      require:
      - spec: '+glx ^[virtuals=gl] glx'
        when: platform=linux
    libsndfile:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'os=rocky8 %gcc@15:'
    librsvg:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
    libstdcompat:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
    intel-mpi-benchmarks:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
    ior:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'os=rocky8 %gcc@15:'
    elfutils:
      require:
      - ~debuginfod~nls
    hdf5:
      require:
      - +mpi+fortran+hl+threadsafe
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: '%gcc@11'
        when: os=rocky9
    netcdf-c:
      require:
      - +mpi+parallel-netcdf
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: '%gcc@11'
        when: os=rocky9
    netcdf-fortran:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: '%gcc@11'
        when: os=rocky9
    ncview:
      require:
      - spec: 'cflags="-std=gnu17"'
        when: 'os=rocky8 %gcc@15:'
    openblas:
      require:
      - threads=openmp
    openmpi:
      require:
      - '@5:'
      - schedulers=none
      - spec: +cuda+fortran fabrics=verbs,ucx
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
        when: '+cuda platform=linux'
      - spec: '~internal-hwloc %gcc@15'
        when: os=rocky8
    paraview:
      require:
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: '+adios2 platform=linux'
    parallel-netcdf:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: '%gcc@11'
        when: os=rocky9
    fides:
      require:
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: platform=linux
    ucx:
      require:
      - spec: +cuda+gdrcopy
        when: platform=linux
      - spec: +dc+rc+rdmacm+thread_multiple+ud+verbs~xpmem
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
        when: '+cuda platform=linux'
      - spec: '%gcc@15'
        when: '+cuda os=rocky8'
    libfabric:
      require:
      - spec: '@2'
        when: platform=linux
      - spec: +cuda+gdrcopy fabrics=mlx,verbs
        when: platform=linux
      - spec: cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
        when: '+cuda platform=linux'
      - spec: '%gcc@15'
        when: '+cuda os=rocky8'
    libpressio:
      require:
      - spec: 'cxxflags="-include algorithm"'
        when: '%gcc@15:'
    rdma-core:
      require:
      - ~pyverbs
    gdrcopy:
      require:
      - +cuda
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
      - spec: '%gcc@15'
        when: '+cuda os=rocky8'
    nccl:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nccl-tests:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nvshmem:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nvbandwidth:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    nvtop:
      require:
      - cuda_arch=75,80,86,87,89,90,90a,100,103,110,120,121
    scorep:
      require:
      - +fortran
      - ~gcc-plugin
    scalasca:
      require:
      - ^openmpi
    seacas:
      require:
      - spec: '^libcatalyst~conduit'
        when: '+libcatalyst platform=linux'
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: '+adios2 platform=linux'
    tau:
      require:
      - spec: '~pdt %gcc@15'
        when: os=rocky8
      - spec: '%gcc@11'
        when: os=rocky9
      - spec: 'cxxflags="-include omp.h"'
        when: '+openmp %gcc@15:'
    vtk-m:
      require:
      - spec: '%gcc@15'
        when: os=rocky8
      - spec: 'cxxflags="-include cstdint -Wno-template-body"'
        when: os=rocky8
    visit:
      require:
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: '+adios2 platform=linux'
    vtk:
      require:
      - spec: 'ldflags="-Wl,--allow-shlib-undefined"'
        when: 'io=adios2 platform=linux'
    hwloc:
      require:
      - ~nvml
      - spec: ~opencl
        when: os=rocky8
      - spec: +cuda
        when: platform=linux
      - spec: '%gcc@15'
        when: '+cuda os=rocky8'
    z3:
      require:
      - spec: '%gcc@15'
        when: os=rocky8

  modules:
    default:
      enable:
      - tcl
      tcl:
        # hpcsim module names are user-facing and must stay name/version only.
        # If root specs collide, fix the roots instead of adding hash suffixes.
        naming_scheme: '{name}/{version}'
        hash_length: 0
        exclude_implicits: true
        pulseaudio:
          environment:
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'

  config:
    deprecated: true
    install_missing: true

  view: false
  concretizer:
    unify: when_possible
