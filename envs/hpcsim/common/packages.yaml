packages:
  all:
    providers:
      mpi: [openmpi]
      blas: [openblas]
      lapack: [openblas]
      libllvm: [llvm]
      scalapack: [netlib-scalapack]
  cmake:
    require:
    - ~qtgui
  fftw:
    require:
    - "@3"
    - +mpi+openmp precision=double,float
  hdf5:
    require:
    - +mpi+fortran+hl+threadsafe
  hwloc:
    require:
    - ~nvml
  libffi:
    require:
    - one_of: ['@3.2.1', '@3.4.7:']
  libtool:
    require:
    - '@2.4.7:'
  llvm:
    require:
    - '@21'
    - +clang+lld~lldb~flang~polly~ipo build_system=cmake targets=x86,nvptx
  netcdf-c:
    require:
    - +mpi+parallel-netcdf
  node-js:
    require:
    - "@24.2.0"
    - "~debug~doc~icu4c+openssl+zlib"
  npm:
    require:
    - '@11.2.0'
  openblas:
    require:
    - threads=openmp
  openmpi:
    require:
    - '@5:'
    - ~internal-pmix
  pmix:
    require:
    - '@6'
  python:
    require:
    - '@3.12:3.12'
    - +tkinter
  zlib-api:
    require:
    - zlib-ng+compat
