suite: intelmpi-cpu
description: Intel MPI CPU RDMA ring test - host-buffer MPI Sendrecv
severity: error
module_needs: [intel-oneapi-mpi]
tool_needs: []
resources:
  nodes: 2
  ntasks_per_node: 1
  time: "00:10:00"
user_input:
  mpi_rdma_bytes: 8388608
  mpi_rdma_iters: 100
  mpi_ranks: 2
  mpi_launcher: mpirun
  mpi_launcher_args: -bootstrap slurm -np ${MPI_RANKS} -ppn 1
  mpi_rdma_cpu_exe: mpi_rdma_cpu.intelmpi
build_commands:
  - cmd: make -B -C "${TEST_DIR}" CPU_EXE="${MPI_RDMA_CPU_EXE}" cpu
env:
  I_MPI_FABRICS: "shm:ofi"
  I_MPI_OFI_PROVIDER: "verbs"
  FI_PROVIDER: "verbs;ofi_rxm"
  I_MPI_OFFLOAD: "0"
  MPI_RDMA_BYTES: "${MPI_RDMA_BYTES}"
  MPI_RDMA_ITERS: "${MPI_RDMA_ITERS}"
run_command: ${MPI_LAUNCHER} ${MPI_LAUNCHER_ARGS} "${TEST_DIR}/${MPI_RDMA_CPU_EXE}"
