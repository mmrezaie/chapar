suite: openmpi-gpu
description: Open MPI GPU RDMA ring test - CUDA device-buffer MPI Sendrecv
severity: error
module_needs: [openmpi, cuda]
tool_needs: []
resources:
  nodes: 2
  ntasks_per_node: 1
  gpus_per_node: 1
  time: "00:10:00"
user_input:
  mpi_rdma_bytes: 8388608
  mpi_rdma_iters: 100
  mpi_ranks: 2
  mpi_launcher: mpirun
  mpi_launcher_args: -np ${MPI_RANKS} --bind-to none --map-by ppr:1:node --prtemca prte_launch_agent ${HPCSIM_PRTED}
  mpi_rdma_gpu_exe: mpi_rdma_cuda.openmpi
  hpcsim_prted: ""
build_commands:
  - cmd: make -B -C "${TEST_DIR}" GPU_EXE="${MPI_RDMA_GPU_EXE}" gpu
env:
  OMPI_MCA_pml: ucx
  OMPI_MCA_osc: ucx
  UCX_TLS: "rc,ud,sm,self,cuda_copy,cuda_ipc,gdr_copy"
  UCX_MEMTYPE_CACHE: "y"
  MPI_RDMA_BYTES: "${MPI_RDMA_BYTES}"
  MPI_RDMA_ITERS: "${MPI_RDMA_ITERS}"
run_command: ${MPI_LAUNCHER} ${MPI_LAUNCHER_ARGS} "${TEST_DIR}/${MPI_RDMA_GPU_EXE}"
