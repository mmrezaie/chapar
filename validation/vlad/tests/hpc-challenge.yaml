suite: hpc-challenge
description: Full HPC benchmark sweep - HPL, HPCG, STREAM, BabelStream
severity: error
module_needs: [openmpi, openblas, hpl, hpcg, stream, babelstream]
tool_needs: []
resources:
  nodes: 1
  ntasks_per_node: 1
  time: "04:00:00"
user_input:
  hpl_dat_file: ""
  hpcg_nx: 104
  hpcg_ny: 104
  hpcg_nz: 104
  hpcg_time: 60
  hplai_dat_file: ""
commands:
  - name: hpl
    cmd: xhpl < "${HPL_DAT_FILE}" > "${RESULTS_DIR}/hpl.log" 2>&1
    output: hpl.log
    prerequisites:
      - test -n "${HPL_DAT_FILE}"
      - test -f "${HPL_DAT_FILE}"
  - name: hpcg
    cmd: hpcgbench --nx="${HPCG_NX:-104}" --ny="${HPCG_NY:-104}" --nz="${HPCG_NZ:-104}" --time="${HPCG_TIME:-60}" > "${RESULTS_DIR}/hpcg.log" 2>&1
    output: hpcg.log
  - name: stream
    cmd: stream_c.exe > "${RESULTS_DIR}/stream.log" 2>&1
    output: stream.log
  - name: babelstream
    cmd: babelStream > "${RESULTS_DIR}/babelstream.log" 2>&1
    output: babelstream.log
