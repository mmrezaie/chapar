suite: io
description: POSIX and MPI-IO I/O validation - IOR, mdtest, h5bench, fio
severity: error
module_needs: [openmpi, ior, mdtest, h5bench, fio]
tool_needs: []
resources:
  nodes: 4
  ntasks_per_node: 4
  time: "01:00:00"
user_input:
  io_test_dir: ""
  ior_block: 32g
  ior_xfer: 4m
  mdtest_files: 100000
  h5bench_cfg: ""
  fio_cfg: ""
commands:
  - name: ior_posix
    cmd: mpirun ior -a POSIX -w -r -t "${IOR_XFER:-4m}" -b "${IOR_BLOCK:-32g}" -o "${RESULTS_DIR}/ior_posix.log"
    output: ior_posix.log
  - name: ior_mpiio
    cmd: mpirun ior -a MPIIO -w -r -t "${IOR_XFER:-4m}" -b "${IOR_BLOCK:-32g}" -o "${RESULTS_DIR}/ior_mpiio.log"
    output: ior_mpiio.log
  - name: mdtest
    cmd: mpirun mdtest -n "${MDTEST_FILES:-100000}" -i 3 -d "${IO_TEST_DIR}/mdtest_run" > "${RESULTS_DIR}/mdtest.log"
    output: mdtest.log
  - name: h5bench
    cmd: h5bench "${H5BENCH_CFG}" > "${RESULTS_DIR}/h5bench.log" 2>&1
    output: h5bench.log
    optional: true
    optional_check: test -n "${H5BENCH_CFG}"
  - name: fio
    cmd: fio --direct=1 --name=test --rw=randread --bs=4k --iodepth=64 --size=1G --loop=3 --directory="${IO_TEST_DIR}" > "${RESULTS_DIR}/fio.log" 2>&1
    output: fio.log
