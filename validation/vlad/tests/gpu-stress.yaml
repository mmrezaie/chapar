suite: gpu-stress
description: Per-GPU memory and compute stress test
severity: error
module_needs: [cuda, cuda-memtest]
tool_needs: [gpu-burn]
resources:
  nodes: 1
  gpus: 1
  time: "08:00:00"
user_input:
  cuda_memtest_passes: 10
commands:
  - name: cuda_memtest_per_gpu
    cmd: |
      for g in $(seq 0 $((NUM_GPUS - 1))); do
        CUDA_VISIBLE_DEVICES="${g}" cuda-memtest --report-mem-errors --num-passes="${CUDA_MEMTEST_PASSES:-10}" > "${RESULTS_DIR}/cuda_memtest_gpu${g}.log"
      done
    output: cuda_memtest_gpu*.log
  - name: gpu_burn
    cmd: '"${TOOL_gpu-burn}" -d 28800 > "${RESULTS_DIR}/gpu-burn.log" 2>&1'
    output: gpu-burn.log
    optional: true
    optional_check: test -x "${TOOL_gpu-burn}"
