suite: ib-pairwise
description: 2-node InfiniBand pair validation - OSU latency/bandwidth, qperf, optional ib_write_bw
severity: error
module_needs: [openmpi, cuda, osu-micro-benchmarks, qperf]
tool_needs: [ib_write_bw]
resources:
  nodes: 2
  ntasks: 2
  time: "00:30:00"
commands:
  - name: osu_latency
    cmd: srun -n 2 --ntasks-per-node=1 osu_latency > "${RESULTS_DIR}/osu_latency.log"
    output: osu_latency.log
  - name: osu_bw
    cmd: srun -n 2 --ntasks-per-node=1 osu_bw > "${RESULTS_DIR}/osu_bw.log"
    output: osu_bw.log
  - name: osu_bibw
    cmd: srun -n 2 --ntasks-per-node=1 osu_bibw > "${RESULTS_DIR}/osu_bibw.log"
    output: osu_bibw.log
  - name: qperf
    cmd: |
      nodes=($(scontrol show hostnames "${NODELIST}"))
      srun -n 2 --ntasks-per-node=1 bash -c '
        if [ $SLURM_NODEID -eq 0 ]; then peer="'"${nodes[1]}"'"; else peer="'"${nodes[0]}"'"; fi
        qperf --verbose "$peer" rc_bw rc_lat
      ' > "${RESULTS_DIR}/qperf.log"
    output: qperf.log
    optional: true
  - name: ib_write_bw
    cmd: srun -n 2 --ntasks-per-node=1 "${TOOL_ib_write_bw}" -a -d mlx5_0 --report_gbits > "${RESULTS_DIR}/ib_write_bw.log"
    output: ib_write_bw.log
    optional: true
    optional_check: test -x "${TOOL_ib_write_bw}"
