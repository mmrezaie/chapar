suite: transport
description: Transport path validation - UCX, Open MPI, libfabric, NCCL debug
severity: error
module_needs: [openmpi, cuda, ucx, libfabric, hwloc, nccl-tests, nccl]
tool_needs: [ucx_perftest, ib_write_bw]
resources:
  nodes: 2
  ntasks: 2
  gpus: 1
  time: "00:30:00"
user_input:
  nccl_debug: INFO
commands:
  - name: ucx_devices
    cmd: ucx_info -d > "${RESULTS_DIR}/ucx_devices.txt" 2>&1
    output: ucx_devices.txt
  - name: ucx_tls
    cmd: ucx_info -t > "${RESULTS_DIR}/ucx_tls.txt" 2>&1
    output: ucx_tls.txt
  - name: ompi_params
    cmd: ompi_info --param all all > "${RESULTS_DIR}/ompi_params.txt" 2>&1
    output: ompi_params.txt
  - name: libfabric_providers
    cmd: fi_info -d > "${RESULTS_DIR}/libfabric_providers.txt" 2>&1
    output: libfabric_providers.txt
  - name: ucx_perftest_cuda
    cmd: srun -n 2 --ntasks-per-node=1 "${TOOL_ucx_perftest}" -c 0 -t tag_lat -n 10000 -b cuda > "${RESULTS_DIR}/ucx_perftest.log" 2>&1 || true
    output: ucx_perftest.log
    optional: true
    optional_check: test -x "${TOOL_ucx_perftest}"
  - name: ib_write_bw
    cmd: srun -n 2 --ntasks-per-node=1 "${TOOL_ib_write_bw}" -d mlx5_0 --report_gbits > "${RESULTS_DIR}/ib_write_bw.log" 2>&1 || true
    output: ib_write_bw.log
    optional: true
    optional_check: test -x "${TOOL_ib_write_bw}"
  - name: nccl_transport
    cmd: NCCL_DEBUG="${NCCL_DEBUG:-INFO}" srun -n 2 --ntasks-per-node=1 "$(find "$(spack location -i nccl-tests 2>/dev/null || echo /usr)" -name all_reduce_perf -print -quit)" -b 8 -e 128M -f 2 -g 1 > "${RESULTS_DIR}/nccl_transport.txt" 2>&1 || true
    output: nccl_transport.txt
    optional: true
