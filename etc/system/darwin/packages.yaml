packages:
  apple-clang:
    externals:
    - spec: apple-clang@17.0.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  gcc:
    externals:
    - spec: gcc@15.2.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-15
          cxx: /opt/homebrew/bin/g++-15
          fortran: /opt/homebrew/bin/gfortran
  gmake:
    externals:
    - spec: gmake@3.81
      prefix: /usr
  gettext:
    externals:
    - spec: gettext@1.0
      prefix: /opt/homebrew
    - spec: gettext@0.19.8.1
      prefix: /usr
  bison:
    externals:
    - spec: bison@3.8.2
      prefix: /opt/homebrew/opt/bison
  openssh:
    externals:
    - spec: openssh@10.0p2
      prefix: /usr
  npm:
    externals:
    - spec: npm@11.9.0
      prefix: /opt/homebrew
  neovim:
    buildable: false
    externals:
    - spec: neovim@stable
      prefix: /opt/homebrew
  git:
    externals:
    - spec: git@2.54.0~tcltk
      prefix: /opt/homebrew
  flex:
    externals:
    - spec: flex@2.6.4+lex
      prefix: /opt/homebrew/opt/flex
  m4:
    externals:
    - spec: m4@1.4.21
      prefix: /opt/homebrew/opt/m4
  ccache:
    externals:
    - spec: ccache@4.13.5
      prefix: /opt/homebrew
  python:
    externals:
    - spec: python@3.12.13+bz2+crypt+ctypes+dbm+lzma+pyexpat+pythoncmd+readline+sqlite3+ssl~tkinter+uuid+zlib
      prefix: /opt/homebrew/opt/python@3.12
  openssl:
    externals:
    - spec: openssl@3.6.2
      prefix: /opt/homebrew
  pkgconf:
    externals:
    - spec: pkgconf@2.5.1
      prefix: /opt/homebrew
  ninja:
    externals:
    - spec: ninja@1.13.2
      prefix: /opt/homebrew
  go:
    externals:
    - spec: go@1.26.0
      prefix: /opt/homebrew
  curl:
    externals:
    - spec: curl@8.7.1+gssapi+ldap+nghttp2
      prefix: /usr
  perl:
    externals:
    - spec: perl@5.34.1~cpanm+opcode+open+shared+threads
      prefix: /usr
  zlib:
    buildable: true
    externals: []
  cmake:
    externals:
    - spec: cmake@4.3.2
      prefix: /opt/homebrew
  autoconf:
    externals:
    - spec: autoconf@2.73
      prefix: /opt/homebrew
  automake:
    externals:
    - spec: automake@1.18.1
      prefix: /opt/homebrew
  libtool:
    externals:
    - spec: libtool@2.5.4
      prefix: /opt/homebrew
  coreutils:
    externals:
    - spec: coreutils@9.11
      prefix: /opt/homebrew
  findutils:
    externals:
    - spec: findutils@4.10.0
      prefix: /opt/homebrew/opt/findutils
  diffutils:
    externals:
    - spec: diffutils@3.12
      prefix: /opt/homebrew
  gawk:
    externals:
    - spec: gawk@5.4.0
      prefix: /opt/homebrew
  sed:
    externals:
    - spec: sed@4.10
      prefix: /opt/homebrew/opt/gnu-sed
  tar:
    externals:
    - spec: tar@1.30
      prefix: /usr
  texinfo:
    externals:
    - spec: texinfo@7.3
      prefix: /opt/homebrew
  groff:
    externals:
    - spec: groff@1.22.3
      prefix: /usr
