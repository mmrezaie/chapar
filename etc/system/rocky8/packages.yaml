# Rocky Linux 8 external packages.
# Keep this scope limited to bootstrap compilers, ccache, and libc. Link-time
# libraries and normal build dependencies should be built by Spack so Rocky 8,
# Rocky 9, and macOS stay as similar as practical.
packages:
  c:
    require:
    - one_of: [gcc@8.5.0, gcc@15]
  cxx:
    require:
    - one_of: [gcc@8.5.0, gcc@15]
  fortran:
    require:
    - one_of: [gcc@8.5.0, gcc@15]
  gcc:
    externals:
    - spec: gcc@8.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
  ccache:
    externals:
    - spec: ccache@3.7.7
      prefix: /usr
  glibc:
    buildable: false
    externals:
    - spec: glibc@2.28
      prefix: /usr
