# Generic Linux fallback.
#
# Do not hard-code compiler or core OS externals here. This scope is loaded for
# every Linux distribution without its own OS overlay. Distro-specific compiler
# versions belong in an OS overlay such as
# etc/system/ubuntu24.04, or in a user-local packages.yaml
# generated with `spack compiler find --scope user` and
# `spack external find --scope user`.
packages: {}
