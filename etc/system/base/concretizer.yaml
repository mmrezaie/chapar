concretizer:
  reuse: true
  targets:
    granularity: generic
    host_compatible: true
  unify: true
  duplicates:
    strategy: minimal
    max_dupes:
      default: 1
      c: 2
      cxx: 2
      fortran: 1
      cmake: 2
      gmake: 2
      python: 2
      python-venv: 2
      py-cython: 2
      py-flit-core: 2
      py-pip: 2
      py-setuptools: 2
      py-versioneer: 2
      py-wheel: 2
      xcb-proto: 2
      gcc: 2
      llvm: 2
  os_compatible: {}
  compiler_mixing: true
  splice:
    explicit: []
    automatic: false
  timeout: 0
  error_on_timeout: true
  static_analysis: false
  concretization_cache:
    enable: true
  externals:
    completion: default_variants
