# Ubuntu 24.04 LTS external packages.
#
# This scope declares what the OS provides; build policy belongs in the catalog
# at envs/software/spack.yaml. Keep it limited to the bootstrap compiler and
# libc. Link-time libraries, CUDA, ccache, and normal build dependencies are
# built by Spack so builders and deployment nodes stay as similar as practical,
# and so an environment does not depend on what a given image happens to ship.
packages:
  c:
    require:
    - one_of: [gcc@15, gcc@13]
  cxx:
    require:
    - one_of: [gcc@15, gcc@13]
  fortran:
    require:
    - one_of: [gcc@15, gcc@13]
  gcc:
    externals:
    - spec: gcc@13 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
  glibc:
    buildable: false
    externals:
    - spec: glibc@2.39
      prefix: /usr
