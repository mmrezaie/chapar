# macOS external packages.
# Keep this scope limited to compilers and optional ccache. Homebrew libraries
# and tools should be built by Spack unless a package proves it needs a site
# external.
packages:
  fortran:
    require:
    - gcc@15.2.0
  apple-clang:
    externals:
    - spec: apple-clang@21.0.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  gcc:
    externals:
    - spec: gcc@15.2.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-15
          cxx: /opt/homebrew/bin/g++-15
          fortran: /opt/homebrew/bin/gfortran
  ccache:
    externals:
    - spec: ccache@4.13.5
      prefix: /opt/homebrew
