# macOS external packages
# Run `spack external find` on your macOS machine and merge the results here.
packages:
  apple-clang:
    externals:
    - spec: apple-clang@17.0.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/clang
          cxx: /usr/bin/clang++
  gcc:
    externals:
    - spec: gcc@15.2.0 languages:='c,c++,fortran'
      prefix: /opt/homebrew
      extra_attributes:
        compilers:
          c: /opt/homebrew/bin/gcc-15
          cxx: /opt/homebrew/bin/g++-15
          fortran: /opt/homebrew/bin/gfortran
  gmake:
    externals:
    - spec: gmake@3.81
      prefix: /usr
  gettext:
    externals:
    - spec: gettext@1.0
      prefix: /opt/homebrew
    - spec: gettext@0.19.8.1
      prefix: /usr
  bison:
    externals:
    - spec: bison@2.3
      prefix: /usr
  openssh:
    externals:
    - spec: openssh@10.0p2
      prefix: /usr
  npm:
    externals:
    - spec: npm@11.9.0
      prefix: /opt/homebrew
  git:
    externals:
    - spec: git@2.50.1~tcltk
      prefix: /usr
  flex:
    externals:
    - spec: flex@2.6.4+lex
      prefix: /usr
  m4:
    externals:
    - spec: m4@1.4.6
      prefix: /usr
  ccache:
    externals:
    - spec: ccache@4.12.3
      prefix: /opt/homebrew
  python:
    externals:
    - spec: python@3.9.6+bz2+crypt+ctypes+dbm+lzma+pyexpat~pythoncmd+readline+sqlite3+ssl+tix+tkinter+uuid+zlib
      prefix: /usr
  openssl:
    externals:
    - spec: openssl@3.6.1
      prefix: /opt/homebrew
  go:
    externals:
    - spec: go@1.26.0
      prefix: /opt/homebrew
  curl:
    externals:
    - spec: curl@8.7.1+gssapi+ldap+nghttp2
      prefix: /usr
  perl:
    externals:
    - spec: perl@5.34.1~cpanm+opcode+open+shared+threads
      prefix: /usr
  zlib:
    externals:
    - spec: zlib@1.2.11
      prefix: /usr
  cmake:
    externals:
    - spec: cmake@3.26.5
      prefix: /usr
  autoconf:
    externals:
    - spec: autoconf@2.69
      prefix: /usr
  automake:
    externals:
    - spec: automake@1.16.1
      prefix: /usr
  libtool:
    externals:
    - spec: libtool@2.4.6
      prefix: /usr
  coreutils:
    externals:
    - spec: coreutils@8.30
      prefix: /usr
  findutils:
    externals:
    - spec: findutils@4.6.0
      prefix: /usr
  diffutils:
    externals:
    - spec: diffutils@3.6
      prefix: /usr
  gawk:
    externals:
    - spec: gawk@4.2.1
      prefix: /usr
  sed:
    externals:
    - spec: sed@4.5
      prefix: /usr
  tar:
    externals:
    - spec: tar@1.30
      prefix: /usr
  texinfo:
    externals:
    - spec: texinfo@6.5
      prefix: /usr
  groff:
    externals:
    - spec: groff@1.22.3
      prefix: /usr
