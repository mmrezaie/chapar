modules:
  prefix_inspections:
    ./bin: [PATH]
    ./man: [MANPATH]
    ./share/man: [MANPATH]
    ./share/aclocal: [ACLOCAL_PATH]
    ./lib/pkgconfig: [PKG_CONFIG_PATH]
    ./lib64/pkgconfig: [PKG_CONFIG_PATH]
    ./share/pkgconfig: [PKG_CONFIG_PATH]
    ./: [CMAKE_PREFIX_PATH]

  default:
    roots:
      tcl: $CHAPAR_MODULE_ROOT
      lmod: $CHAPAR_MODULE_ROOT/lmod

    enable: [tcl]

    tcl:
      naming_scheme: "{name}/{version}"
      hash_length: 0
      exclude_implicits: true
      all:
        autoload: direct

    lmod:
      naming_scheme: "{name}/{version}"
      hash_length: 0
      exclude_implicits: true
      all:
        autoload: direct
      hierarchy:
        - mpi
