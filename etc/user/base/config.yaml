config:
  build_jobs: 16
  concurrent_packages: 16
  install_tree:
    root: $CHAPAR_INSTALL_TREE_ROOT
    projections:
      all: "{name}-{version}-{hash}"
  build_stage:
    - $CHAPAR_SPACK_BUILD_STAGE
  test_stage: $user_cache_path/test
  source_cache: $user_cache_path/source
  misc_cache: $user_cache_path/cache
